<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Section -->
    <div class="hero-container">
        <button class="theme-toggle-btn" id="theme-toggle" title="Toggle Theme">🌙</button>
        <img src="resources/logo.png" alt="What's My Tab? Logo" class="hero-logo">
    </div>

    <!-- Search & Filter Controls -->
    <div class="controls-section">
        <input type="text" id="search" placeholder="Search tabs...">

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="favorites">Favorites</button>
            <button class="filter-btn" data-filter="grouped">Grouped</button>
        </div>
    </div>

    <!-- Main Tabs List Container -->
    <div class="tabs-container" id="tab-list">
        <!-- This is dynamic, tabs will be loaded here -->
    </div>

    <!-- Favorited Tabs -->
    <div class="sticky-favorites" id="favorites-bar">
        <div class="favorites-header">
            <span>Favorited Tabs</span>
            <span class="favorites-count" id="fav-count">0/5</span>
        </div>

        <div class="favorites-list" id="favorites-list">
            <!-- Up to 5 Favorited Tabs will show here -->
        </div>
    </div>

    <script src="logic.js"></script>
</body>
</html>
